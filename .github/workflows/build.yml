name: Build Windows installer

on:
  workflow_dispatch:      # lets you press a "Run workflow" button
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Build the program
        run: >
          pyinstaller --noconfirm --clean --windowed --name MyIPWidget
          --icon assets/images/icon.ico
          --add-data "assets;assets"
          --collect-submodules pystray
          main.py

      - name: Check the built program
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MyIPWidget\MyIPWidget.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Keep the installer (download it from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: MyIPWidget-Setup
          path: installer_output/MyIPWidget-Setup.exe

      - name: Publish a release (only when a version tag is pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/MyIPWidget-Setup.exe
